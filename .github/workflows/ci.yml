name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh-tanstack-security-lockfile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fix/tanstack-start-cve-2026-102989'
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fix/tanstack-start-cve-2026-102989'
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fix/tanstack-start-cve-2026-102989'
        with:
          version: 9.15.0
      - name: Regenerate and validate pnpm lockfile
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fix/tanstack-start-cve-2026-102989'
        run: |
          pnpm install --lockfile-only --no-frozen-lockfile
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const lock = fs.readFileSync('pnpm-lock.yaml', 'utf8');
          const versions = (name) => [...lock.matchAll(new RegExp("'" + name.replace('/', '\\\/') + "@(\\d+\\.\\d+\\.\\d+)", 'g'))].map((m) => m[1]);
          const cmp = (a, b) => a.split('.').map(Number).reduce((n, v, i) => n || (v - Number(b.split('.')[i])), 0);
          const starts = versions('@tanstack/react-start');
          const cores = versions('@tanstack/start-server-core');
          if (!starts.length || starts.some((v) => cmp(v, '1.168.60') < 0)) throw new Error('Unsafe @tanstack/react-start resolution: ' + starts.join(', '));
          if (!cores.length || cores.some((v) => cmp(v, '1.169.39') < 0)) throw new Error('Unsafe @tanstack/start-server-core resolution: ' + cores.join(', '));
          console.log('Verified react-start:', [...new Set(starts)].join(', '));
          console.log('Verified start-server-core:', [...new Set(cores)].join(', '));
          NODE
      - name: Commit regenerated lockfile to this draft branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fix/tanstack-start-cve-2026-102989'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m 'chore(deps): regenerate patched TanStack lockfile'
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          else
            echo 'Lockfile already current; no commit required.'
          fi

  lint-and-typecheck:
    needs: [refresh-tanstack-security-lockfile]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      - uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm tsc --noEmit
      - name: Lint
        run: pnpm lint
      - name: Format check
        run: pnpm prettier --check "src/**/*.{ts,tsx}" "server/**/*.{ts,tsx}"

  test:
    needs: [refresh-tanstack-security-lockfile]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      - uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm vitest run

  build:
    needs: [lint-and-typecheck, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      - uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build

  stars-postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vixor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vixor_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply migration and verify Stars invariants in disposable PostgreSQL
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d vixor_test -v ON_ERROR_STOP=1 -f supabase/tests/telegram_stars_atomic.sql
