name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      - uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm tsc --noEmit
      - name: Lint
        run: pnpm lint
      - name: Format check
        run: pnpm prettier --check "src/**/*.{ts,tsx}" "server/**/*.{ts,tsx}"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      - uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm vitest run

  payments-rls:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Verify payment RLS prevents client-side state changes
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f .github/scripts/payments-rls-setup.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20261106000000_reconcile_payments_rls.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f .github/scripts/payments-rls-assertions.sql

  build:
    needs: [lint-and-typecheck, test, payments-rls]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      - uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build

  stars-postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vixor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vixor_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply migration and verify Stars invariants in disposable PostgreSQL
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d vixor_test -v ON_ERROR_STOP=1 -f supabase/tests/telegram_stars_atomic.sql
      - name: Apply Gate 5 security and payer-binding regression suite in disposable PostgreSQL
        env:
          PGPASSWORD: postgres
        run: createdb -h localhost -U postgres vixor_gate5_test && psql -h localhost -U postgres -d vixor_gate5_test -v ON_ERROR_STOP=1 -f supabase/tests/gate5_security_stars_payer.sql
      - name: Replay the complete APP migration chain from the recovered historical baseline
        env:
          PGPASSWORD: postgres
          PGHOST: localhost
          PGUSER: postgres
          PGDATABASE: vixor_bootstrap_test
        run: createdb -h localhost -U postgres vixor_bootstrap_test && bash supabase/tests/replay-migrations.sh

      - uses: supabase/setup-cli@v1
        with:
          version: 2.81.3
      - name: Verify migration history is readable by Supabase CLI
        env:
          PGPASSWORD: postgres
        run: |
          printf 'project_id = "vixor-app-ci"\n' > supabase/config.toml
          psql -h localhost -U postgres -d vixor_bootstrap_test -v ON_ERROR_STOP=1 -c "CREATE SCHEMA IF NOT EXISTS supabase_migrations; CREATE TABLE IF NOT EXISTS supabase_migrations.schema_migrations (version text PRIMARY KEY, statements text[]);"
          # Supabase CLI requires TLS for its remote-style connection path.
          PG_CONTAINER_ID="$(docker ps --filter ancestor=postgres:16 --format '{{.ID}}' | head -n 1)"
          test -n "$PG_CONTAINER_ID"
          openssl req -new -x509 -days 1 -nodes -out /tmp/pg-server.crt -keyout /tmp/pg-server.key -subj "/CN=localhost" -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
          docker cp /tmp/pg-server.crt "$PG_CONTAINER_ID:/var/lib/postgresql/data/server.crt"
          docker cp /tmp/pg-server.key "$PG_CONTAINER_ID:/var/lib/postgresql/data/server.key"
          docker exec -u root "$PG_CONTAINER_ID" chown postgres:postgres /var/lib/postgresql/data/server.crt /var/lib/postgresql/data/server.key
          docker exec -u postgres "$PG_CONTAINER_ID" chmod 600 /var/lib/postgresql/data/server.key
          docker exec -u postgres "$PG_CONTAINER_ID" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET ssl = 'on'; SELECT pg_reload_conf();"
          psql "postgresql://postgres:postgres@localhost:5432/vixor_bootstrap_test?sslmode=require" -v ON_ERROR_STOP=1 -c "SELECT ssl FROM pg_stat_ssl WHERE pid = pg_backend_pid();" | grep -q t
          supabase migration list --db-url "postgresql://postgres:postgres@localhost:5432/vixor_bootstrap_test?sslmode=require"
